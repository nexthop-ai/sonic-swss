  #   components:
  #     - name: libsairedis
  #       type: shared-library
  #       deploy_to: /usr/lib/x86_64-linux-gnu/libsairedis.so.1
  #       post_build:
  #         - make install DESTDIR=/build/install-root
  #
  #   repo_deps:
  #     - sonic-swss-common

# Usage examples:
#
# 1. Default (only sonic-swss):
#    ./dvs-test.py prepare --dev
#
# 2. Include swss-common:
#    ./dvs-test.py prepare --dev --repo swss-common
#
# 3. Override swss-common path:
#    ./dvs-test.py prepare --dev --repo swss-common=/custom/path/sonic-swss-common
#
# 4. Multiple repos:
#    ./dvs-test.py prepare --dev --repo swss-common --repo sairedis
#
# 5. List available repos:
#    ./dvs-test.py --list-repos
